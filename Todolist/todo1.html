<html>
    <head>
      <title>Today Task</title>

      <style>
        body{
            background: white;
            color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; 
        }
        .add-task{
            background: white;
            position:relative;
            font-size: 25px;
            }
        input{
            width: 100%;
            padding: 12px;
            outline: none;
            font-size: 18px;
            border: none;
        }
         button{
            padding:10px 15px;
            font-size:18px;
            cursor:pointer;
            border: none;
            background: grey;
            border-radius: 5px;
        }
        #list{
            list-style: none;
            padding: 0;
        }

        #list li{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;

        }
        #list li button{
            padding: 5px 10px;
            font-size: 15px;
            background: grey;
            border-radius: 5px;
            border: none;

        }

      </style>

    </head>

    <body>  
        <div class="add-task">
            
            <h1>Today Task</h1>
            <hr>
            <input type="text" id="task" placeholder="Add New Task">
            <hr>
            <button onclick="addTask()">+</button>
            <ul id="list"></ul>
        </div>


<script>
    function addTask(){
        var task = document.getElementById("task").value;

        if(task===""){
            alert("Please enter the task");
            return;
        }

        document.getElementById("list").innerHTML+=

        "<li>" + 
        task  + 
        "<button onclick = 'this.parentElement.remove()'>Delete</button>" + 
        "</li>"

        document.getElementById("task").value="";
    }    
    



</script>
        
    </body>


</html>
