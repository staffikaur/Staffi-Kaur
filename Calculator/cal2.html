<html>
    <head>
        <title>Calculator</title>

  <style>
   *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
   }

   body{
    background:black;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
   }

  .calculator{
    background: #052a42;
    color: white;
    padding: 20px;
    border: none;
    border-radius: 10px;
    box-shadow: 0 0 10px white;
  }
h1{
    font-size: 40px;
    text-align: center;
    margin-bottom: 20px;
}

input{
    width: 100%;
    color: white;
    background: grey;
    padding: 18px;
    margin-bottom: 20px;
    border-radius: 10px;
    border: none;
    text-align: right;
}

.buttons{
     display: grid;
     grid-template-columns: repeat(4,1fr);
     gap: 10px;
     
}
button{
    padding: 20px;
    box-shadow: 0 0 5px white;
    background: #e5d7d7;
    border: none;
    font-size: 22px;
    border-radius: 5px;
    transition: .3s ease-in-out;
    cursor: pointer;

}
button:hover{
    transform: scale(1.2);
}
.operator{
    background: orange;
    color: white;
}

.zero{
    grid-column:span 2;
    width: 100%;
}
.clear{
     grid-column:span 2;
    width: 100%;
}
.equal{
     grid-column:span 2;
    width: 100%;
}

/* Todolist */

.container{
    display:flex;
    gap:40px;
    align-items:flex-start;
}

.todo{
    width: 350px;
    background: #ebebec;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 0 30px #c2f007;
    font-size: 20px;
    text-align: center;
}
h2{
    font-size: 30px;
    margin-bottom: 20px;
}
.todo input{
    width: 100%;
    font-size: 20px;
    text-align: left;
    color:white;
    border: none;

}

.todo button{
    background: #052a42;
    color: white;
    border-radius: 10px;
    font-size: 23px;
     margin-top: 15px;
    
}

#list{
    list-style: none;
    padding: 0;
    margin-top: 20px;
}

#list li{
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
}

#list li button{
    padding: 5px 10px;
    font-size: 16px;
    margin-left: 10px;
    background: red;
    color: white;
    border-radius: 5px;
}

#list li span{
    flex:1;
    margin-left:10px;
}





  </style>
    </head>
    <body>


<!-- Calculator -->

<div class="container">
       <div class="calculator">
       <h1>Calculator</h1>

    <input type="text" id="display" placeholder="0" readonly>
    
    <div class="buttons">

    <button onclick="appendValue('7')">7</button>
    <button onclick="appendValue('8')">8</button>
    <button onclick="appendValue('9')">9</button>
    <button class="operator" onclick="appendValue('/')">/</button>

    <button onclick="appendValue('4')">4</button>
    <button onclick="appendValue('5')">5</button>
    <button onclick="appendValue('6')">6</button>
    <button class="operator" onclick="appendValue('*')">*</button>

    <button onclick="appendValue('1')">1</button>
    <button onclick="appendValue('2')">2</button>
    <button onclick="appendValue('3')">3</button>
    <button class="operator" onclick="appendValue('-')">-</button>

    <button class="zero" onclick="appendValue('0')">0</button>
    <button onclick="appendValue('.')">.</button>
    <button class="operator" onclick="appendValue('+')">+</button>

    <button class="clear" onclick="clearDisplay()">AC</button>
    <button class="equal" onclick="calculate()">=</button>
    </div>
    </div>

    <!-- To-do-List -->

    <div class="todo">

        <h2>To-Do-List</h2>

        <input type="text" id="task" placeholder="Enter your task">

        <button onclick="addTask()">Add</button>

        <ul id="list"></ul>

    </div>
    </div>


    <script>
        
        // Calculator

         const display =
            document.getElementById("display");

        function appendValue(value){
            display.value += value;
        }

        function clearDisplay(){
            display.value = "";
        }
        function calculate(){
            try{
                let expression =display.value;

            expression = expression.replace(/(\d+(\.\d+)?)%/g, "($1/100)");
                 display.value= eval(expression);
            }
            catch{
                display.value = "Error";
            }   
        }

    // todolist

        function addTask(){

            let task = document.getElementById("task").value;

            if(task===""){
                alert("Please enter task");
                return;
            }

            document.getElementById("list").innerHTML += 
            "<li>" +
            "<input type='checkbox'>" +
            "<span>" + task + "</span>" +
            "<button onclick='this.parentElement.remove()'>x</button>" + 
            "</li>";

            document.getElementById("task").value="";
          }
             
    </script>
    </body>
</html>
